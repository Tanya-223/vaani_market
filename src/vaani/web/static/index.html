<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0b1020" />
<link rel="manifest" href="/static/manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Vaani Market</title>
<style>
  :root{
    --plane:#0b1020; --surface:#141b2e; --surface-2:#1b2440;
    --ink:#f0efec; --ink-2:#c3c2b7; --muted:#8b93a7;
    --line:rgba(255,255,255,.08); --grid:#28304a; --baseline:#3a4568;
    --series:#3987e5; --up:#0ca30c; --down:#d03b3b; --accent:#60a5fa; --warn:#fab219;
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--plane); color:var(--ink);
    font-family:"Noto Sans Telugu","Noto Sans Devanagari",system-ui,-apple-system,sans-serif;
    padding:16px 16px 200px; max-width:560px; margin:0 auto; min-height:100vh; position:relative;
  }
  /* faint grid pattern behind content (subtle; text contrast preserved) */
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(1200px 480px at 50% -8%,#15203c 0%,transparent 60%),
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:100% 100%,26px 26px,26px 26px;
    opacity:1;}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:var(--plane);opacity:.90;} /* mutes the grid so lines are barely visible */

  header{display:flex;align-items:center;gap:11px;margin:4px 0 10px}
  .logo{width:42px;height:42px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(145deg,#1b2440,#223056);display:grid;place-items:center;
    border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .logo svg{width:26px;height:26px}
  header h1{font-size:20px;margin:0;font-weight:700}
  header p{margin:1px 0 0;color:var(--muted);font-size:12px}
  .notadv{margin-left:auto;font-size:10px;font-weight:600;color:var(--warn);
    border:1px solid rgba(250,178,25,.35);border-radius:999px;padding:3px 9px;white-space:nowrap}

  /* language selector */
  .langsel{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:5px;margin:8px 0}
  .langsel button{flex:1;min-height:40px;border:none;border-radius:8px;background:transparent;
    color:var(--ink-2);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  .langsel button.active{background:linear-gradient(145deg,#3987e5,#60a5fa);color:#06142b}
  .draftbar{font-size:11px;color:var(--warn);margin:2px 2px 0;min-height:15px}

  .section-label{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;
    letter-spacing:.05em;margin:16px 2px 8px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .lcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;
    padding:11px 6px;text-align:center;cursor:pointer;transition:.15s;min-height:84px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
  .lcard:active{transform:scale(.96);background:var(--surface-2)}
  .lcard svg{width:26px;height:26px}
  .lcard span{font-size:11px;line-height:1.25;color:var(--ink-2)}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
    border-radius:999px;padding:9px 13px;font-size:13px;font-family:inherit;cursor:pointer;
    min-height:40px;transition:.15s}
  .chip:active{transform:scale(.97);background:var(--surface-2)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:15px;margin:12px 0;box-shadow:0 1px 0 rgba(255,255,255,.03),0 12px 30px rgba(0,0,0,.25);
    transition:box-shadow .3s,border-color .3s}
  .card.speaking{border-color:rgba(96,165,250,.5);box-shadow:0 0 0 1px rgba(96,165,250,.3),0 12px 34px rgba(96,165,250,.18)}
  .label{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .bubble{background:var(--surface-2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;
    padding:11px 14px;font-size:15px;color:var(--ink-2);margin-top:6px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
    border-radius:999px;padding:3px 10px;border:1px solid var(--line)}
  .badge.answer{color:#8fe3bf;border-color:rgba(12,163,12,.35)}
  .badge.refuse{color:#f6a6a6;border-color:rgba(208,59,59,.4)}
  .badge.clarify{color:#ffd77a;border-color:rgba(250,178,25,.4)}
  .badge.no_data,.badge.decline{color:var(--ink-2)}
  #answer{font-size:19px;line-height:1.55;margin:12px 0 4px}
  .statrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:10px 0}
  .price{font-size:30px;font-weight:700;letter-spacing:-.5px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;border-radius:999px;padding:4px 11px}
  .pill.up{background:rgba(12,163,12,.14);color:#48d06f}
  .pill.down{background:rgba(208,59,59,.15);color:#f0787a}
  .chartwrap{margin:10px 0 4px}
  svg{width:100%;height:auto;display:block}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .kpi{flex:1;min-width:120px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .kpi .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .kpi .k{font-size:11px;color:var(--muted);margin-top:2px}
  .headline{font-size:14px;padding:9px 0;border-top:1px solid var(--line);color:var(--ink-2)}
  .headline small{color:var(--muted)}
  .note{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
  .meta{color:var(--muted);font-size:11.5px;margin-top:11px;display:flex;flex-wrap:wrap;gap:6px 14px}
  .meta .ok{color:#48d06f}
  .disclaimer{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line);color:var(--warn);font-size:12.5px;font-weight:500}

  .dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px 20px;max-width:560px;margin:0 auto;
    background:linear-gradient(transparent,var(--plane) 28%)}
  .mic-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
  .wave{display:flex;align-items:center;gap:4px;height:22px}
  .wave span{width:4px;height:6px;border-radius:2px;background:var(--accent);animation:eq 1s ease-in-out infinite}
  .wave span:nth-child(2){animation-delay:.12s}.wave span:nth-child(3){animation-delay:.24s}
  .wave span:nth-child(4){animation-delay:.36s}.wave span:nth-child(5){animation-delay:.48s}
  .wave span:nth-child(6){animation-delay:.6s}.wave span:nth-child(7){animation-delay:.72s}
  @keyframes eq{0%,100%{height:6px}50%{height:22px}}
  .wave.hidden{display:none}
  #mic{width:72px;height:72px;border-radius:50%;border:none;cursor:pointer;position:relative;
    background:linear-gradient(145deg,#3987e5,#60a5fa);color:#06142b;font-size:27px;font-weight:800;
    box-shadow:0 10px 26px rgba(96,165,250,.4);transition:transform .1s}
  #mic:active{transform:scale(.95)}
  #mic.rec{background:linear-gradient(145deg,#d03b3b,#f0787a);color:#fff}
  #mic.busy{background:var(--surface-2);color:var(--muted);cursor:wait}
  #status{color:var(--muted);font-size:13px;min-height:18px;text-align:center}
  .dots::after{content:"";animation:dots 1.4s steps(4,end) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  .footnote{text-align:center;color:var(--warn);font-size:11px;margin-top:8px;opacity:.9}
  .typed{display:flex;gap:8px;margin-top:10px}
  .typed input{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--ink);
    border-radius:11px;padding:12px 13px;font-size:15px;font-family:inherit;min-height:44px}
  .typed input::placeholder{color:var(--muted)}
  .typed button{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
    border-radius:11px;padding:0 16px;font-family:inherit;font-weight:600;min-height:44px}
  .hidden{display:none}
</style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 28 28" fill="none">
        <!-- sound-wave bars -->
        <rect x="3"  y="12" width="2.4" height="4"  rx="1.2" fill="#60a5fa"/>
        <rect x="7"  y="9"  width="2.4" height="10" rx="1.2" fill="#60a5fa"/>
        <rect x="11" y="6"  width="2.4" height="16" rx="1.2" fill="#3987e5"/>
        <rect x="15" y="9"  width="2.4" height="10" rx="1.2" fill="#60a5fa"/>
        <rect x="19" y="12" width="2.4" height="4"  rx="1.2" fill="#60a5fa"/>
        <!-- rising line through them -->
        <polyline points="3,20 9,16 14,17 20,9 25,5" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="25" cy="5" r="2" fill="#34d399"/>
      </svg>
    </div>
    <div>
      <h1>Vaani Market</h1>
      <p id="tagline"></p>
    </div>
    <span class="notadv">Not advice</span>
  </header>

  <div class="langsel" id="langsel"></div>
  <div class="draftbar" id="draftbar"></div>

  <div class="section-label" id="basicsLabel"></div>
  <div class="cards" id="cards"></div>

  <div class="section-label" id="tryLabel"></div>
  <div class="chips" id="chips"></div>

  <div id="result" class="hidden">
    <div class="card">
      <div class="label" id="youAskedLabel"></div>
      <div class="bubble" id="transcript"></div>
    </div>
    <div class="card" id="answerCard">
      <span class="badge" id="routing"></span>
      <div id="answer"></div>
      <div id="viz"></div>
      <div id="headlines"></div>
      <div id="note"></div>
      <div class="meta" id="meta"></div>
      <div class="disclaimer" id="disclaimer"></div>
    </div>
  </div>

  <div class="dock">
    <div class="mic-wrap">
      <div class="wave hidden" id="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <button id="mic" aria-label="Record">🎤</button>
      <div id="status"></div>
    </div>
    <div class="typed">
      <input id="typed" />
      <button id="send"></button>
    </div>
    <div class="footnote" id="footnote"></div>
  </div>

  <audio id="player" class="hidden"></audio>
  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
